    <body>
        <div id="wrap">
            <!-- popup -->
            <div class="popWrap" style="max-width: 480px">
                <div class="popHead">
                    <p class="popTitle">프로젝트 경력 관리</p>
                    <button type="button" class="popClose" onclick="modalClose(this)">닫기</button>
                </div>
                <div class="popBody">
                    <div class="inner">
                        <!-- 타이틀 영역 -->
                        <div class="titArea noBorder">
                            <div class="titBox">
                                <h3>경력 내용</h3>
                            </div>
                        </div>

                        <!-- 테이블 영역 -->
                        <div class="tblForm type1">
                            <table>
                                <caption>
                                    경력 내용
                                </caption>
                                <colgroup>
                                    <col style="width: 120px" />
                                    <col style="width: auto" />
                                </colgroup>
                                <tbody>
                                    <tr>
                                        <th>프로젝트명<span class="req">*</span></th>
                                        <td>
                                            <div class="inputArea">
                                                <input type="text" class="md" placeholder="프로젝트명을 입력하세요." />
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>시작일<span class="req">*</span></th>
                                        <td>
                                            <div class="inputArea">
                                                <input
                                                    type="text"
                                                    class="md"
                                                    placeholder="‘-’ 없이 (YYYYMMDD)를 입력하세요"
                                                />
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>종료일<span class="req">*</span></th>
                                        <td>
                                            <div class="inputArea">
                                                <input
                                                    type="text"
                                                    class="md"
                                                    placeholder="‘-’ 없이 (YYYYMMDD)를 입력하세요"
                                                />
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>프로젝트 개요</th>
                                        <td>
                                            <div class="inputArea">
                                                <input
                                                    type="text"
                                                    class="md"
                                                    placeholder="프로젝트 개요를 입력하세요."
                                                />
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>담당역할<span class="req">*</span></th>
                                        <td>
                                            <div class="inputArea">
                                                <input type="text" class="md" placeholder="담당역할을 입력하세요." />
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>기술 역량</th>
                                        <td>
                                            <div class="inputArea">
                                                <input type="text" class="md" placeholder="기술 역량을 입력하세요." />
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>발주처</th>
                                        <td>
                                            <div class="inputArea">
                                                <input type="text" class="md" placeholder="발주처를 입력하세요." />
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="btnArea right">
                            <a href="#none" class="btn lg primary-default">저장</a>
                        </div>
                    </div>
                </div>
            </div>
            <!-- popup -->
            <div id="dim"></div>
        </div>
        <script>
            $(document).ready(() => {
                $('#dim').fadeIn('fast');
            });
        </script>
    </body>
