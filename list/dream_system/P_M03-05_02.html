    <body>
        <div id="wrap">
            <!-- popup -->
            <div class="popWrap" style="max-width: 1024px">
                <div class="popHead">
                    <p class="popTitle">교육공지 관리</p>
                    <button type="button" class="popClose" onclick="modalClose(this)">닫기</button>
                </div>
                <div class="popBody">
                    <div class="inner">
                        <!-- 테이블 영역 -->
                        <div class="tblForm type1">
                            <table>
                                <caption>
                                    교육공지 관리
                                </caption>
                                <colgroup>
                                    <col style="width: 100px" />
                                    <col style="width: 230px" />
                                    <col style="width: 200px" />
                                    <col style="width: 230px" />
                                </colgroup>
                                <tbody>
                                    <tr>
                                        <th class="al">연월<span class="req">*</span></th>
                                        <td colspan="3" class="al">
                                            <div class="datepickerWrap" style="width: 160px">
                                                <div>
                                                    <input type="text" class="yearMonthBtn md" value="2025-01" />
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="al">제목<span class="req">*</span></th>
                                        <td colspan="3" class="al">
                                            <div class="inputArea w100">
                                                <input type="text" class="md" placeholder="제목을 입력하세요" />
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="al">진행방식<span class="req">*</span></th>
                                        <td colspan="3" class="al">
                                            <div class="inputArea w100">
                                                <input type="text" class="md" placeholder="내용을 입력하세요" />
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="al">대상법인</th>
                                        <td class="al">
                                            <div class="formArea pt8 pb8 fwW">
                                                <div>
                                                    <input type="checkbox" id="check0101" /><label for="check0101"
                                                        >효성ITX</label
                                                    >
                                                </div>
                                                <div>
                                                    <input type="checkbox" id="check0102" /><label for="check0102"
                                                        >행복 두드리미</label
                                                    >
                                                </div>
                                            </div>
                                        </td>
                                        <th class="al">대상직군(본사,센터)</th>
                                        <td class="al">
                                            <div class="formArea">
                                                <select class="md">
                                                    <option selected>전체</option>
                                                    <option>항목1</option>
                                                    <option>항목2</option>
                                                </select>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="al">상세이미지</th>
                                        <td colspan="3" class="al">에디터</td>
                                    </tr>
                                </tbody>
