        <title>DREAM SYSTEM</title>
    </head>
    <body>
        <div id="wrap">
            <!-- popup -->
            <div class="popWrap tblSingle" style="max-width: 1024px">
                <div class="popHead">
                    <p class="popTitle">네일아트 예약 등록</p>
                    <button type="button" class="popClose" onclick="modalClose(this)">닫기</button>
                </div>
                <div class="popBody">
                    <div class="inner">
                        <div class="titArea noBorder">
                            <div class="titBox">
                                <h4>상세</h4>
                            </div>
                        </div>
                        <!-- 테이블 영역 -->
                        <div class="tblForm type1">
                            <table>
                                <caption>
                                    상세
                                </caption>
                                <colgroup>
                                    <col style="width: 100px" />
                                    <col style="width: 250px" />
                                    <col style="width: 100px" />
                                    <col style="width: 250px" />
                                </colgroup>
                                <tbody>
                                    <tr>
                                        <th class="al">서비스점<span class="req">*</span></th>
                                        <td class="al" colspan="3">
                                            <div class="formArea pt8 pb8 fwW">
                                                <div>
                                                    <input
                                                        type="radio"
                                                        id="radio0101"
                                                        name="radio01"
                                                        checked=""
                                                    /><label for="radio0101">당산</label>
                                                </div>
                                                <div>
                                                    <input type="radio" id="radio0102" name="radio01" /><label
                                                        for="radio0102"
                                                        >영등포</label
                                                    >
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="al">예약자<span class="req">*</span></th>
                                        <td class="al">
                                            <div class="inputArea w100">
                                                <input
                                                    id="autoInput"
                                                    type="text"
                                                    class="md"
                                                    placeholder="직원명·사번·부서 검색(ENTER)"
                                                />
                                                <div id="autoList" class="autoList"></div>
                                            </div>
                                        </td>
                                        <th class="al">휴대폰<span class="req">*</span></th>
                                        <td class="al">
                                            <div class="inputArea">
                                                <input
                                                    type="text"
                                                    class="md"
                                                    placeholder="'-' 없이 숫자로 입력하세요"
                                                />
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="al">예약일자<span class="req">*</span></th>
                                        <td class="al">
                                            <div class="datepickerWrap">
                                                <div class="w100t">
                                                    <input type="text" class="yearMonthBtn md" value="2025-01" />
                                                </div>
                                            </div>
                                        </td>
                                        <th class="al">예약시간<span class="req">*</span></th>
                                        <td class="al">
                                            <div class="inputArea">
                                                <div class="formArea w100">
                                                    <select class="md">
                                                        <option disabled selected>선택</option>
                                                        <option>항목1</option>
                                                        <option>항목2</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="al">비고</th>
                                        <td class="al" colspan="3">
                                            <div class="inputArea pt10 pb10">
                                                <textarea></textarea>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!--
                            <div class="noResult">
                                <div class="innerResult">
                                    <div class="resultTxt"><i class="ico icoWarningTri">데이터없음</i> 조회된 결과가 없습니다.</div>
                                </div>
                            </div>
                            -->
                        </div>
                        <div class="btnArea right">
                            <a href="#none" class="btn lg primary-default">저장</a>
                        </div>
                    </div>
                </div>
            </div>
            <!-- popup -->
            <div id="dim"></div>
        </div>
        <script>
            $(document).ready(() => {
                $('#dim').fadeIn('fast');
            });
        </script>
    </body>
