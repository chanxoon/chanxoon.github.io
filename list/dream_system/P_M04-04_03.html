    <body>
        <div id="wrap">
            <!-- popup -->
            <div class="popWrap tblSingle" style="max-width: 1024px">
                <div class="popHead">
                    <p class="popTitle">예약관리 SMS 전송</p>
                    <button type="button" class="popClose" onclick="modalClose(this)">닫기</button>
                </div>
                <div class="popBody">
                    <div class="inner">
                        <div class="titArea noBorder">
                            <div class="titBox">
                                <h4>SMS 내용</h4>
                            </div>
                        </div>
                        <!-- 테이블 영역 -->
                        <div class="tblForm type1">
                            <table>
                                <caption>
                                    SMS 내용
                                </caption>
                                <colgroup>
                                    <col style="width: 100px" />
                                    <col />
                                </colgroup>
                                <tbody>
                                    <tr>
                                        <th class="al">유형</th>
                                        <td class="al">
                                            <div class="formArea pt8 pb8 fwW">
                                                <div>
                                                    <input
                                                        type="radio"
                                                        id="radio0101"
                                                        name="radio01"
                                                        checked=""
                                                    /><label for="radio0101">인사말</label>
                                                </div>
                                                <div>
                                                    <input type="radio" id="radio0102" name="radio01" /><label
                                                        for="radio0102"
                                                        >예약 안내</label
                                                    >
                                                </div>
                                                <div>
                                                    <input type="radio" id="radio0103" name="radio01" /><label
                                                        for="radio0103"
                                                        >매장확인</label
                                                    >
                                                </div>
                                                <div>
                                                    <input type="radio" id="radio0104" name="radio01" /><label
                                                        for="radio0104"
                                                        >취소처리안내</label
                                                    >
                                                </div>
                                                <div>
                                                    <input type="radio" id="radio0105" name="radio01" /><label
                                                        for="radio0105"
                                                        >직접입력</label
                                                    >
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="al">내용</th>
                                        <td class="al">
                                            <div class="inputArea pt10 pb10">
                                                <textarea></textarea>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="al">받는사람</th>
                                        <td class="al">010-1234-1234</td>
                                    </tr>
                                    <tr>
                                        <th class="al">보내는 사람</th>
                                        <td class="al">
                                            <div class="inputArea">
                                                <input
                                                    type="text"
                                                    class="md"
                                                    placeholder="'-' 없이 숫자로 입력하세요"
                                                    value="010-1234-1234"
                                                />
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
