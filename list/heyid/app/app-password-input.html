        </div>

            <button type="button" class="close-btn">확인</button>
        </div>
    </div>

<script>
function PwCheck1(pw) {
    var _this = this; 
    _this.pwStr = pw.toString();
    _this.password = [];
    _this.passwordNumber = []; 
    _this.cnt = 0; 
    _this.compChk = false; 
    _this.parent = document.querySelector('.pwWrap');
    _this.dots = document.querySelectorAll('.pw1 .dot');
    _this.numbers = document.querySelectorAll('.number');

    // 비밀번호를 배열에 넣음 
    _this.getPw = function(){
        for(var i=0; i<_this.pwStr.length; i++) {
            _this.password[i] = _this.pwStr[i];
        }
    }
    // 숫자버튼 click이벤트 연동
    _this.handleListener = function(){
        if(!_this.compChk) {
            _this.numbers.forEach(function(number){
                number.addEventListener('click', function(){_this.handleNumber(number)});
            })
        }
    }
    // 숫자키를 눌렀을때 이벤트 
    _this.handleNumber = function(number){
        if(!_this.compChk) {
            _this.passwordNumber[_this.cnt] = number.textContent;
            _this.handleDotActive(true);
            _this.cnt++;
            if(_this.cnt === 6) {
                _this.handleResult();
            }
        }
    }
    // dot 활성화 
    _this.handleDotActive = function(type){
        if(type) {
            // _this.dots.forEach(function(dot, i){
            //     if(i === _this.cnt) dot.classList.add('active'); 

            //     if(i === _this.cnt){
            //         $(dot).text(_this.passwordNumber[_this.cnt]);
            //     }
            // })

            $(_this.dots).each(function () {
                var a = $(this).text();
                if (!a) {
                    $(this).text(_this.passwordNumber[_this.cnt]);
                    $(this).addClass('active');
                    return false;
                }
            })
        } else {
            // _this.dots.forEach(function(dot){
            //     dot.classList.remove('active');
            // })

            $($(_this.dots).get().reverse()).each(function(){
                var a = $(this).text();
                if (a) {
                    $(this).text("");
                    $(this).removeClass('active');
                    return false;
                }
            })
        }
    }

    // 비밀번호 비교
    _this.handleCheckPw = function(){
        var compare = JSON.stringify(_this.password) === JSON.stringify(_this.passwordNumber);
        return compare; 
    }

    function errorcount() {
        var cou = $(".app-password .tit-box .error-count span").text();
        cou++;
        $(".app-password .tit-box .error-count span").text(cou)

        if(cou === 5) {
            $('.login-lock-layer').show();
            loginlock();
        }
    }

    // 결과처리 
    _this.handleResult = function(){
        if(_this.handleCheckPw()) {
            location.href='index.html';
            _this.compChk = true;
        } else {
            //alert('비밀번호가 일치하지 않습니다. 비밀번호를 재입력 해주세요.');
            $('.app-password.input .tit-box p').text('비밀번호가 일치하지 않습니다.').css('color','#F7941D');
            // 입력상태 초기화 
            _this.passwordNumber = [];
            _this.cnt = 0; 
            _this.compChk = true; // 일시적인 클릭 방지 
            errorcount();
            
            setTimeout(function(){
                $('.app-password.input .tit-box p').text('6자리 숫자 비밀번호를 입력해주세요.').css('color','');
            }, 3000);
            setTimeout(function(){
                _this.compChk = false;
                _this.handleDotActive();
                $(_this.dots).text('').removeClass('active');
            }, 500);
        }
    }
    
    _this.init = function(){
        _this.handleListener();
        _this.getPw();
    }();

    $('.app-password .del-btn').click(function(){
        _this.handleDotActive(false);
        if(_this.cnt > 0) {
            _this.cnt--;
        } else {
            _this.cnt;
        }
    });
}
PwCheck1(111111);

/* 로그인 잠김 타이머 */
function loginlock() {
    var progressBar = document.querySelector('.e-c-progress');
    var pointer = document.getElementById('e-pointer');
    var length = Math.PI * 2 * 100;

    progressBar.style.strokeDasharray = length;

    function update(value, timePercent) {
    var offset = - length - length * value / (timePercent);
    progressBar.style.strokeDashoffset = offset; 
    pointer.style.transform = `rotate(${360 * value / (timePercent)}deg)`; 
    };

    var displayOutput = document.querySelector('.display-remain-time');
    var intervalTimer;
    var timeLeft;
    var wholeTime = 1.0 * 60; 
    var resetTime = 0;

    function timer (seconds){ 
    var remainTime = Date.now() + (seconds * 1000);
    displayTimeLeft(seconds);

    intervalTimer = setInterval(function(){
        timeLeft = Math.round((remainTime - Date.now()) / 1000);
        if(timeLeft < 0){
        clearInterval(intervalTimer);
        displayTimeLeft(resetTime);
        $('.login-lock-layer').fadeOut('fast');
        location.reload(true);
        return ;
        }
        displayTimeLeft(timeLeft);
    }, 1000);
    }

    function displayTimeLeft (timeLeft){ 
    var minutes = Math.floor(timeLeft / 60);
    var seconds = timeLeft % 60;
    var displayString = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    displayOutput.textContent = displayString;
    update(timeLeft, wholeTime);
    }

    timer(wholeTime);
};
</script>
