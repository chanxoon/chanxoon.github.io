<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no" />
<title>HeyID - 앱 비밀번호 설정</title>

<link rel="shortcut icon" type="image/x-icon" href="/">
<link href="./css/common.css" rel="stylesheet">
<link href="./css/swiper.min.css" rel="stylesheet">
<link href="./css/default.css" rel="stylesheet">

<script src="./js/jquery-1.11.2.min.js"></script>
<script src="./js/dragula.min.js"></script>
<script src="./js/swiper.min.js"></script>
<script src="./js/default.js"></script>    
</head>
<body>

<div class="wrap app-password">
    <!-- nav -->
    <nav id="nav">
        <button type="button" class="back-btn white" onclick="history.back()">뒤로가기</button>
    </nav>
    
    <!-- con -->
    <div id="contents">
        <div class="inner">
            <div class="tit-box">
                <h2>앱 비밀번호 설정</h2>
                <p>6자리 숫자 비밀번호를 입력해주세요.</p>
            </div>

            <div class="con-box">
                <div class="input-box password pwWrap">                    
                    <div class="pwSection pw1">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>

                <div class="bot-txt">
                    <p><img src="./images/icon/icon-security.svg" alt="보안"> 보안을 위한 앱 비밀번호가 필요합니다.</p>
                </div>
                <div class="num-box">
                    <div class="numberSection p1">
                        <button type="button" class="number">1</button>
                        <button type="button" class="number">2</button>
                        <button type="button" class="number">3</button>
                        <button type="button" class="number">4</button>
                        <button type="button" class="number">5</button>
                        <button type="button" class="number">6</button>
                        <button type="button" class="number">7</button>
                        <button type="button" class="number">8</button>
                        <button type="button" class="number">9</button>
                        <button type="button" class="number zero">0</button>
                        <button type="button" class="del-btn"><img src="./images/icon/icon-del.svg" alt="삭제"></button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
function PwCheck() {
    var _this = this; 
    //_this.pwStr = pw.toString();
    _this.password = [];
    _this.passwordNumber = []; 
    _this.cnt = 0; 
    _this.compChk = false; 
    _this.parent = document.querySelector('.pwWrap');
    _this.dots = document.querySelectorAll('.pw1 .dot');
    _this.numbers = document.querySelectorAll('.number');
    _this.firstpw = _this.passwordNumber;

    // 비밀번호를 배열에 넣음 
    // _this.getPw = function(){
    //     for(var i=0; i<_this.pwStr.length; i++) {
    //         _this.password[i] = _this.pwStr[i];
    //     }
    // }

    // 숫자버튼 click이벤트 연동
    _this.handleListener = function(){
        if(!_this.compChk) {
            _this.numbers.forEach(function(number){
                number.addEventListener('click', function(){_this.handleNumber(number)});
            })
        }
    }
    // 숫자키를 눌렀을때 이벤트 
    _this.handleNumber = function(number){
        if(!_this.compChk) {
            _this.passwordNumber[_this.cnt] = number.textContent;
            _this.handleDotActive(true);
            _this.cnt++;
            console.log(_this.firstpw, _this.passwordNumber);

            if(_this.cnt === 6) {
                if($('.pwSection').hasClass('pw1')){
                    // 입력상태 초기화 
                    _this.passwordNumber = [];
                    _this.cnt = 0; 
                    _this.compChk = true;
                    setTimeout(function(){
                        _this.compChk = false;
                        _this.handleDotActive();
                        $(_this.dots).text('').removeClass('active');
                    }, 500);
                } else {
                    // 결과처리
                    _this.handleResult();
                }
                $('.pwSection').addClass('pw2').removeClass('pw1');
                $('.app-password .tit-box h2').text('앱 비밀번호 확인');
                $('.app-password .tit-box p').text('비밀번호를 재입력 해주세요.');
            }
        }
    }
    // dot 활성화 
    _this.handleDotActive = function(type){
        if(type) {
            // _this.dots.forEach(function(dot, i){
            //     if(i === _this.cnt) dot.classList.add('active'); 

            //     if(i === _this.cnt){
            //         $(dot).text(_this.passwordNumber[_this.cnt]);
            //     }
            // })
            $(_this.dots).each(function () {
                var a = $(this).text();
                if (!a) {
                    $(this).text(_this.passwordNumber[_this.cnt]);
                    $(this).addClass('active');
                    return false;
                }
            })
        } else {
            // _this.dots.forEach(function(dot){
            //     dot.classList.remove('active');
            // })
            $($(_this.dots).get().reverse()).each(function(){
                var a = $(this).text();
                if (a) {
                    $(this).text("");
                    $(this).removeClass('active');
                    return false;
                }
            })
        }
    }
    // 비밀번호 비교
    _this.handleCheckPw = function(){
        var compare = JSON.stringify(_this.firstpw) === JSON.stringify(_this.passwordNumber);
        return compare; 
    }
    // 결과처리 
    _this.handleResult = function(){
        if(_this.handleCheckPw()) {
            location.href='/app/index.html';
            _this.compChk = true;
        } else {
            alert('비밀번호가 일치하지 않습니다. 비밀번호를 재입력 해주세요.');
            // 입력상태 초기화 
            _this.passwordNumber = [];
            _this.cnt = 0; 
            _this.compChk = true; // 일시적인 클릭 방지 
            
            setTimeout(function(){
                _this.compChk = false;
                _this.handleDotActive();
                $(_this.dots).text('').removeClass('active');
            }, 500);
        }
    }
    
    _this.init = function(){
        _this.handleListener();
        //_this.getPw();
    }();

    $('.app-password .del-btn').click(function(){
        _this.handleDotActive(false);
        if(_this.cnt > 0) {
            _this.cnt--;
        } else {
            _this.cnt;
        }
    });
}

PwCheck();
</script>

</body>
</html>
