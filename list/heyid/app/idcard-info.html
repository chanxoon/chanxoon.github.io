<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no" />
<title>HeyID - 신분증 정보확인</title>

<link rel="shortcut icon" type="image/x-icon" href="/">
<link href="./css/common.css" rel="stylesheet">
<link href="./css/swiper.min.css" rel="stylesheet">
<link href="./css/default.css" rel="stylesheet">

<script src="./js/jquery-1.11.2.min.js"></script>
<script src="./js/dragula.min.js"></script>
<script src="./js/swiper.min.js"></script>
<script src="./js/default.js"></script>    
</head>
<body>

<div class="wrap idcard-info">    
    <!-- con -->
    <div id="contents">
        <div class="inner">
            <div class="tit-box">
                <h2>신분증 정보확인</h2>
                <p>신청한 신분증 정보가 동일한지 확인 후 <br>비밀번호를 설정해주세요.</p>
            </div>

            <div class="con-box">
                <div class="info">
                    <p><span>김대한</span><span>/</span><span>900214-1******</span></p>
                    <p>한국법무사사무소</p>
                    <p>실장</p>
                </div>
            </div>

            <div class="btn-box">
                <p>사용자정보가 다른 경우 아래 오류신고를 <br>해주시기 바랍니다.</p>
                <button type="button" class="error-btn">오류신고</button>
                <button type="button" class="confirm-btn">확인</button>
            </div>
        </div>
    </div>
</div>

<!-- 오류신고 팝업 -->
<div class="layer-pop report-error-layer" style="display: none;">
    <div class="inner report-error">
        <div class="tit-box">
            <h2>오류신고</h2>
            <p>오류 유형을 선택하세요.</p>
        </div>
        <div class="con-box">
            <p><label><input type="radio" name="error-type" checked>제 사진이 아닙니다.</label></p>
            <p><label><input type="radio" name="error-type">이름이 일치하지 않습니다.</label></p>
            <p><label><input type="radio" name="error-type">생년월일 정보가 일치하지 않습니다.</label></p>
        </div>
        <div class="btn-box">
            <button type="button" class="com-btn">신고</button>
        </div>
        <div class="close">
            <button type="button" class="close-btn"></button>
        </div>
    </div>
</div>

<!-- 오류신고완료 팝업 -->
<div class="layer-pop report-complete-layer" style="display: none;">
    <div class="inner report-complete">
        <div class="tit-box">
            <h2>오류신고</h2>
            <p>신고 내용을 보냈습니다. 신속한 처리가 진행될 수 있도록 최선을 다하겠습니다. 감사합니다.</p>
        </div>
        <div class="con-box">
            <p><a href="tel:02-123-4567">고객센터 02-123-4567</a></p>
        </div>
        <div class="btn-box">
            <button type="button" class="close-btn">완료</button>
        </div>
        <div class="close">
            <button type="button" class="close-btn"></button>
        </div>
    </div>
</div>

</body>
</html>
