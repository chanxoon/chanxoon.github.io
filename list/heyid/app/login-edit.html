<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no" />
<title>HeyID - 로그인 설정</title>

<link rel="shortcut icon" type="image/x-icon" href="/">
<link href="./css/common.css" rel="stylesheet">
<link href="./css/swiper.min.css" rel="stylesheet">
<link href="./css/default.css" rel="stylesheet">

<script src="./js/jquery-1.11.2.min.js"></script>
<script src="./js/dragula.min.js"></script>
<script src="./js/swiper.min.js"></script>
<script src="./js/default.js"></script>    
</head>
<body>

<div class="wrap login-edit">
    <!-- nav -->
    <nav id="nav">
        <button type="button" class="back-btn" onclick="history.back()">뒤로가기</button>
    </nav>
    
    <!-- con -->
    <div id="contents">
        <div class="inner">
            <div class="tit-box">
                <h2>로그인 설정</h2>
                <p>로그인 시 사용할 기본 로그인 방식을<br>선택하세요.</p>
            </div>

            <div class="con-box">
                <div id="password-login"><label><img src="./images/icon/icon-logtype-pass-black.svg" alt="비밀번호"> <span>간편 비밀번호 로그인</span><input type="radio" name="login-type" checked></label></div>
                <div id="faceid-login"><label><img src="./images/icon/icon-logtype-face-black.svg" alt="얼굴"> <span>Face ID 로그인</span><input type="radio" name="login-type"></label></div>
                <div id="touchid-login"><label><img src="./images/icon/icon-logtype-touch-black.svg" alt="지문"> <span>Touch ID 로그인</span><input type="radio" name="login-type"></label></div>
                <div id="biometric-login"><label><img src="./images/icon/icon-logtype-biometric-black.svg" alt="생체인식"> <span>생체인식 로그인</span><input type="radio" name="login-type"></label></div>
            </div>

            <div class="btn-box">
                <button type="button" class="type1 on">재설정</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
