<!-- 유저가 선택한 로그인 방식 -->
<div class="way">
	<div class="inner">
		<span class="icon"></span>
		<div class="explanation">
			<strong class="title">직접입력<button type="button" class="otp-btn"><img src="./images/home/icon-question.png" alt="물음표">OTP 확인방법<img src="./images/home/icon-arr-right.png" alt="화살표"></button></strong>
			<p class="desc"><strong>heyID 신분증</strong>의 <strong>OTP번호</strong>를 입력하여 본인임을<br />인증하세요.</p>
			<ul>
				<li>heyID 어플로 인증이 가능합니다.</li>
				<li>HeyID 신분증에서 OTP번호 (6자리)를 확인하여 <br>입력해주세요.</li>
				<li>숫자를 잘못 입력한 경우 [삭제]를 눌러 다시<br />작성하실 수 있습니다.</li>
				<li>입력이 완료되면 [확인]을 눌러주세요.</li>
			</ul>
		</div>
	</div>
</div>

<!-- 로그인 방식 -->
<div class="primary">
	<div class="user-direct">
		<div class="inner">
			<div class="field">
				<div class="pwSection">
					<span class="dot"></span>
					<span class="dot"></span>
					<span class="dot"></span>
					<span class="dot"></span>
					<span class="dot"></span>
					<span class="dot"></span>
				</div>
			</div>
			<div class="numberSection">
				<button type="button" class="number">1</button>
				<button type="button" class="number">2</button>
				<button type="button" class="number">3</button>
				<button type="button" class="number">4</button>
				<button type="button" class="number">5</button>
				<button type="button" class="number">6</button>
				<button type="button" class="number">7</button>
				<button type="button" class="number">8</button>
				<button type="button" class="number">9</button>
				<button type="button" class="reset-btn">초기화</button>
				<button type="button" class="number zero">0</button>
				<button type="button" class="del-btn"><img src="./images/home/icon-del.png" alt="삭제"></button>
				<button type="button" class="con-btn">확인</button>
			</div>
		</div>
	</div>
</div>
