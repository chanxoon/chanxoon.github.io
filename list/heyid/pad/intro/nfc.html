<!-- 유저가 선택한 로그인 방식 -->
<div class="way">
	<div class="inner">
		<span class="icon"></span>
		<div class="explanation">
			<strong class="title">NFC</strong>
			<p class="desc"><strong>NFC 리더기</strong>에 <strong>heyID 신분증</strong>을 올려 본인임을<br />인증하세요.</p>
			<ul>
				<li>heyID 어플로 인증이 가능합니다.</li>
				<li>NFC 리더기에 heyID 신분증을 가까이 가져다<br />주세요.</li>
				<li>NFC가 인식되지 않은 경우 [직접입력인증]<br />메뉴를 통해 인식을 진행해주세요.</li>
				<li>인식이 완료되면 [확인]을 눌러주세요.</li>
			</ul>
		</div>
	</div>
</div>

<!-- 로그인 방식 -->
<div class="primary">
	<div class="progress">
		<div class="outer">
			<strong>출입인증 대기중입니다.</strong>
			<p>인증을 진행해주세요.</p>
			<div class="inner">
				<div class="fixed-image"><img src="./images/home/nfc/nfc_progress.png" alt=""></div>
				<div class="animation">
					<span class="item sphere1"></span>
					<span class="item sphere2"></span>
					<span class="item sphere3"></span>
					<span class="item sphere4"></span>
					<span class="item sphere5"></span>
					<span class="item sphere6"></span>
				</div>
				<div class="sequence"><img src="./images/home/nfc/sequence/nfc_00000.png" alt=""></div>
			</div>
		</div>
	</div>
</div>
