    </head>
    <body>
        <div id="wrap">
            <!-- popup -->
            <div class="popup type2" style="max-width: 900px">
                <div class="popHead">
                    <p class="popTitle">고객서비스 1-1팀</p>
                    <button type="button" class="popClose" onclick="modalClose(this)">닫기</button>
                </div>
                <div class="popBody">
                    <div class="inner">
                        <!-- 검색 영역 -->
                        <div class="searchBox">
                            <ul>
                                <li>
                                    <dl>
                                        <dt>상태</dt>
                                        <dd>
                                            <div class="formArea">
                                                <select class="md" style="width: 160px">
                                                    <option>상태</option>
                                                </select>
                                            </div>
                                        </dd>
                                    </dl>
                                </li>
                            </ul>
                            <ul>
                                <li>
                                    <div class="searchBtn type2">
                                        <input type="text" class="md sea" placeholder="검색어를 입력해주세요" />
                                        <button class="btn sm outline">
                                            <i class="icon icon-search">검색 아이콘</i>
                                            <span>검색</span>
                                        </button>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <!-- 테이블 영역 -->
                        <div class="tblBox">
                            <div class="tblList type2">
                                <table>
                                    <caption>
                                        팀 관리
                                    </caption>
                                    <colgroup>
                                        <col style="width: auto" />
                                        <col style="width: 25%" />
                                        <col style="width: 25%" />
                                    </colgroup>
                                    <thead>
                                        <tr>
                                            <th>
                                                팀명
                                                <button type="button" class="ico icoSorting">오름차순</button>
                                            </th>
                                            <th>
                                                인원수
                                                <button type="button" class="ico icoSorting">오름차순</button>
                                            </th>
                                            <th>
                                                수정
                                                <button type="button" class="ico icoSorting">오름차순</button>
                                            </th>
                                        </tr>
                                    </thead>
                                    <!-- <tbody>
                                        <tr>

                                        </tr>
                                    </tbody> -->
                                </table>
                                <div class="noResult">
                                    <div class="innerResult">
                                        <i class="ico icoNodata">데이터없음</i>
                                        <div class="resultTxt">등록된 데이터가 없습니다.</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- popup -->
            <div id="dim"></div>
        </div>
        <script>
            $(document).ready(() => {
                $('#dim').fadeIn('fast');
            });
        </script>
