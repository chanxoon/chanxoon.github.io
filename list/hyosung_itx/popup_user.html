        <div id="wrap">

                <div class="popHead">
                    <p class="popTitle">테넌트 생성</p>
                    <button type="button" class="popClose" onclick="modalClose(this)">닫기</button>

                            <div class="titBox">

                            </div>
                        </div>
                        <div class="formArea">
                            <ul>
                                <li>
                                    <dl>
                                        <dt>테넌트명<span class="req">*</span></dt>
                                        <dd>
                                            <div class="inputBox">
                                                <input type="text" class="sm" placeholder="테넌트명 입력" />
                                            </div>
                                        </dd>
                                    </dl>
                                </li>
                                <li>
                                    <dl>
                                        <dt>사용기간<span class="req">*</span></dt>
                                        <dd>
                                            <div class="datepickerWrap" style="width: 278px">

                                                    <input type="text" value="2025-01-22" class="datepicker sm" />
                                                </div>
                                                <span>-</span>
                                                <div>
                                                    <input type="text" value="2025-01-23" class="datepicker sm" />
                                                </div>
                                            </div>
                                        </dd>
                                    </dl>
                                    <dl>
                                        <dt>Prefix ID<span class="req">*</span></dt>
                                        <dd>
                                            <div class="inputBox">
                                                <input type="text" class="sm" placeholder="Prefix ID 입력" />
                                            </div>
                                        </dd>
                                    </dl>
                                </li>
                            </ul>
                        </div>

                        <div class="titArea">
                            <div class="titBox">
                                <h3>담당자 등록</h3>
                            </div>
                            <div class="btnBox">
                                <a href="javascript:;" class="btn outline xs">담당자 추가</a>
                            </div>
                        </div>
                        <div class="tblList" style="height: 176px">
                            <table>
                                <caption>

                                </caption>
                                <colgroup>

                                    <col style="width: 200px" />
                                    <col style="width: 200px" />
                                    <col style="width: 200px" />

                                    <tr>

                                        <th>이름<span class="req">*</span></th>
