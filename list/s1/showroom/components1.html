        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            .wrap-online-showroom.sr-component {
                background: rgba(266, 266, 266, 0.8);
                padding: 20px;
                overflow: auto;
            }

            .wrap-online-showroom.sr-component h1,
            h2,
            h3,
            h4 {
                font-weight: 700;
                line-height: 1;
            }

            .wrap-online-showroom.sr-component h1 {
                margin-bottom: 20px;
                font-size: 28px;
            }

            .wrap-online-showroom.sr-component .sr-component-set > h2 {
                font-size: 24px;
                margin-top: 32px;
            }

            .wrap-online-showroom.sr-component .sr-component-box > h3 {
                font-size: 18px;
                margin-top: 16px;
                position: relative;
                padding-left: 14px;
            }

            .wrap-online-showroom.sr-component .sr-component-box > h3::before {
                content: '';
                display: inline-block;
                width: 8px;
                height: 8px;
                border-width: 0 0 2px 2px;
                border-style: solid;
                border-color: #222;
                position: absolute;
                left: 1px;
                top: 49%;
                margin-top: -4px;
            }

            .wrap-online-showroom.sr-component .sr-component-item {
                border: 1px solid #ccc;
                border-radius: 4px;
                padding: 20px;
                margin-top: 16px;
            }

            .wrap-online-showroom.sr-component .sr-component-item > h4 {
                padding-left: 14px;
                position: relative;
                font-size: 16px;
                color: #666;
                margin-bottom: 16px;
            }

            .wrap-online-showroom.sr-component .sr-component-item > h4:before {
                content: '▼';
                font-size: 7px;
                display: inline-block;
                position: absolute;
                left: 2px;
                top: 4px;
            }

            .wrap-online-showroom.sr-component .sr-component-item-inner {
                margin-bottom: 16px;
            }
        </style>
    </head>

    <body>
        <!-- 쇼룸 공통 컴포넌트 -->
        <div id="wrapShowroom" class="wrap-online-showroom sr-component">

            <div class="sr-component-set">

                                <div style="padding: 20px; background-color: rgba(0, 0, 0, 0.1)">
                                    <!-- 요소 -->

                                            <span class="skew-wavelength-layer1"></span>
                                            <span class="skew-wavelength-layer2"></span>
                                            <span class="skew-wavelength-layer3"></span>
                                        </span>
                                    </em>
                                    <!--// 요소 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
