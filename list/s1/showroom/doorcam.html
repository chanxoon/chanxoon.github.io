        <script>
            function setView() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const wrap = document.querySelector('.showroom-content-wrap3');
                const srBgA = document.querySelector('.showroom-background-area');
                const widthSize = 1920;
                const heightSize = 1080;

                // 너비나 높이가 지정된 크기 이상인 경우 원래 크기 유지
                if (width >= widthSize && height >= heightSize) {
                    wrap.style.transform = `translate3d(-50%,-50%, 0) scale(1)`;
                    srBgA.style.transform = `translate3d(-50%,-50%, 0) scale(1)`;
                    return;
                }

                const horizontalZoomRate = width / widthSize;
                const verticalZoomRate = height / heightSize;
                const zoomRate = widthSize * verticalZoomRate > width ? horizontalZoomRate : verticalZoomRate;

                wrap.style.transform = `translate3d(-50%,-50%, 0) scale(${zoomRate})`;
                srBgA.style.transform = `translate3d(-50%,-50%, 0) scale(${zoomRate})`;
            }
            setView();
            window.addEventListener('resize', setView);

            window.addEventListener('DOMContentLoaded', () => {
                showroomComm();
                showroom7();
            });
        </script>
